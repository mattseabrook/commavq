<!DOCTYPE html>
<html>

<head>
    <title>Byte Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #cccccc;
            font-family: monospace;
            overflow-x: auto;
        }

        #header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            background: #2a2a2a;
            border-bottom: 2px solid #444;
            z-index: 30;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #header h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
        }

        #header h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            font-weight: normal;
            color: #cccccc;
            font-style: italic;
        }

        #header .info {
            font-size: 10px;
            line-height: 1.2;
            color: #cccccc;
            font-family: 'Courier New', monospace;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        #dropzone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(26, 26, 26, 0.9);
            z-index: 40;
            font-size: 24px;
            border: 2px dashed #666;
            box-sizing: border-box;
        }

        #visualization-container {
            position: absolute;
            top: 200px;
            left: 0;
            width: 100%;
            height: calc(100vh - 200px);
            overflow: auto;
            background: #1a1a1a;
        }

        #hex-grid {
            position: relative;
            display: inline-block;
            min-width: 100%;
        }

        .row {
            display: flex;
            align-items: center;
            height: 25px;
            white-space: nowrap;
        }

        .row-header {
            width: 80px;
            text-align: right;
            padding-right: 10px;
            font-size: 12px;
            color: #888;
            background: #2a2a2a;
            border-right: 1px solid #444;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .column-headers {
            display: flex;
            align-items: center;
            height: 25px;
            position: sticky;
            top: 0;
            background: #2a2a2a;
            border-bottom: 1px solid #444;
            z-index: 10;
        }

        .column-headers .row-header {
            background: #2a2a2a;
        }

        .column-header {
            width: 25px;
            text-align: center;
            font-size: 10px;
            color: #888;
            border-right: 1px solid #444;
        }

        .hex-byte {
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-family: monospace;
            border-right: 1px solid #333;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 20;
            font-size: 12px;
            display: none;
        }

        #loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        #loading::before {
            content: '';
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #9932cc;
            /* Purple to match theme */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #views {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 35;
            display: none;
        }

        #views button {
            background-color: #444;
            color: white;
            border: 1px solid #666;
            padding: 5px 10px;
            margin-left: 5px;
            cursor: pointer;
        }

        #views button.active {
            background-color: #9932cc;
        }
    </style>
</head>

<body>
    <div id="header">
        <h1>commavq VQ-VAE Data Visualization</h1>
        <h2 id="filename">Drag & Drop a .token.npy file to begin</h2>
        <div id="fileinfo" class="info"></div>
    </div>
    <div id="dropzone">Drag & Drop a .token.npy file here</div>
    <div id="info" style="display: none;"></div>
    <div id="visualization-container">
        <div id="hex-grid"></div>
    </div>
    <div id="loading"></div>
    <div id="views">
        <button id="btn-default" class="active">Default</button>
        <button id="btn-token">Token View</button>
        <button id="btn-frame">Frame View</button>
    </div>
    <script>
        var commavqVIZ = {
            ui: {
                x: 0,
                y: 0
            }
        };
        document.addEventListener('DOMContentLoaded', function () {
            commavqVIZ.ui.x = window.innerWidth;
            commavqVIZ.ui.y = window.innerHeight - 200;
            var dropzone = document.getElementById('dropzone');
            var fileinfo = document.getElementById('fileinfo');
            var filename = document.getElementById('filename');
            var hexGrid = document.getElementById('hex-grid');
            var loading = document.getElementById('loading');
            var views = document.getElementById('views');
            var header = document.getElementById('header');
            var vizContainer = document.getElementById('visualization-container');
            var byteArray = null;
            var tokenData = null;
            document.body.addEventListener('dragover', function (e) {
                e.preventDefault();
                dropzone.style.background = 'rgba(100,0,200,0.3)';
            });
            document.body.addEventListener('dragleave', function (e) {
                e.preventDefault();
                dropzone.style.background = 'rgba(26, 26, 26, 0.9)';
            });
            document.body.addEventListener('drop', function (e) {
                e.preventDefault();
                dropzone.style.display = 'none';
                var file = e.dataTransfer.files[0];
                if (file && file.name.endsWith('.token.npy')) {
                    filename.textContent = file.name;
                    var reader = new FileReader();
                    reader.onload = function (event) {
                        byteArray = new Uint8Array(event.target.result);
                        if (byteArray.length !== 307328) {
                            alert('Invalid file size. Expected 307,328 bytes.');
                            dropzone.style.display = 'flex';
                            return;
                        }
                        var headerBytes = byteArray.slice(0, 128);
                        tokenData = byteArray.slice(128);
                        if (tokenData.length !== 307200) {
                            alert('Invalid data size after header removal. Expected 307,200 bytes.');
                            dropzone.style.display = 'flex';
                            return;
                        }
                        // Convert header to ASCII with proper escape handling
                        var headerLines = [];
                        for (var i = 0; i < headerBytes.length; i += 16) {
                            var line = '';
                            var hexPart = '';
                            var asciiPart = '';
                            for (var j = 0; j < 16 && (i + j) < headerBytes.length; j++) {
                                var byte = headerBytes[i + j];
                                hexPart += byte.toString(16).padStart(2, '0').toUpperCase() + ' ';
                                if (byte >= 32 && byte <= 126) {
                                    asciiPart += String.fromCharCode(byte);
                                } else if (byte === 0) {
                                    asciiPart += '\u2400'; // NULL symbol ␀
                                } else if (byte === 9) {
                                    asciiPart += '\u2409'; // TAB symbol ␉
                                } else if (byte === 10) {
                                    asciiPart += '\u240A'; // LF symbol ␊
                                } else if (byte === 13) {
                                    asciiPart += '\u240D'; // CR symbol ␍
                                } else {
                                    asciiPart += '\u00B7'; // Middle dot ·
                                }
                            }
                            line = (i.toString(16).padStart(4, '0').toUpperCase() + ': ' +
                                hexPart.padEnd(48, ' ') + ' | ' + asciiPart);
                            headerLines.push(line);
                        }
                        fileinfo.textContent = 'NumPy Header (128 bytes):\n' + headerLines.join('\n');
                        header.style.height = 'auto';
                        const headerHeight = header.offsetHeight;
                        vizContainer.style.top = headerHeight + 'px';
                        vizContainer.style.height = `calc(100vh - ${headerHeight}px)`;
                        views.style.display = 'block';
                        visualizeBytes('default');
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    fileinfo.innerHTML = 'Please drop a .token.npy file';
                    dropzone.style.display = 'flex';
                }
            });
            ['default', 'token', 'frame'].forEach((m) => {
                document.getElementById(`btn-${m}`).addEventListener('click', function () {
                    document.querySelectorAll('#views button').forEach((b) => b.classList.remove('active'));
                    this.classList.add('active');
                    loading.style.display = 'block';
                    setTimeout(() => {
                        visualizeBytes(m);
                        loading.style.display = 'none';
                    }, 0);
                });
            });
            function visualizeBytes(mode) {
                if (!tokenData) return;
                hexGrid.innerHTML = '';
                // Create column headers
                var columnHeaders = document.createElement('div');
                columnHeaders.className = 'column-headers';
                var rowHeaderSpace = document.createElement('div');
                rowHeaderSpace.className = 'row-header';
                rowHeaderSpace.textContent = 'Offset';
                columnHeaders.appendChild(rowHeaderSpace);
                var cols = 64;
                if (mode === 'token') {
                    cols = 32;
                }
                for (var col = 0; col < cols; col++) {
                    var colHeader = document.createElement('div');
                    colHeader.className = 'column-header';
                    var colText = col.toString(16).padStart(2, '0').toUpperCase();
                    if (mode === 'token') {
                        colText = (col * 2).toString(16).padStart(2, '0').toUpperCase();
                    }
                    colHeader.textContent = colText;
                    columnHeaders.appendChild(colHeader);
                }
                hexGrid.appendChild(columnHeaders);
                // Create rows with data
                var bytesPerRow = 64;
                if (mode === 'token') {
                    bytesPerRow = 64; // still 64 bytes, but 32 tokens
                }
                var totalRows = Math.ceil(tokenData.length / bytesPerRow);
                var view = new DataView(tokenData.buffer);
                for (var row = 0; row < totalRows; row++) {
                    var rowDiv = document.createElement('div');
                    rowDiv.className = 'row';
                    // Row header (offset in hex)
                    var rowHeader = document.createElement('div');
                    rowHeader.className = 'row-header';
                    var offset = row * bytesPerRow;
                    rowHeader.textContent = offset.toString(16).padStart(8, '0').toUpperCase();
                    rowDiv.appendChild(rowHeader);
                    // Bytes or tokens
                    for (var col = 0; col < cols; col++) {
                        var byteIndex = row * bytesPerRow + col;
                        var hexByte = document.createElement('div');
                        hexByte.className = 'hex-byte';
                        if (byteIndex < tokenData.length) {
                            var byteValue = tokenData[byteIndex];
                            var textContent = byteValue.toString(16).padStart(2, '0').toUpperCase();
                            var normValue = byteValue;
                            var title = 'Offset: 0x' + byteIndex.toString(16).toUpperCase() +
                                '\nValue: ' + byteValue + ' (0x' + textContent + ')';
                            if (mode === 'token') {
                                byteIndex = row * bytesPerRow + col * 2;
                                if (byteIndex >= tokenData.length) {
                                    hexByte.style.backgroundColor = '#1a1a1a';
                                    hexByte.textContent = '';
                                    rowDiv.appendChild(hexByte);
                                    continue;
                                }
                                byteValue = view.getInt16(byteIndex, true);
                                textContent = byteValue.toString();
                                normValue = Math.min(Math.max(byteValue, 0), 1023) / 1023 * 255;
                                var binaryValue = (byteValue & 0xFFFF).toString(2).padStart(16, '0');
                                title = 'Offset: 0x' + byteIndex.toString(16).toUpperCase() +
                                    '\nValue: ' + binaryValue;
                            }
                            var lightness = 25 + (normValue / 255) * 65;
                            hexByte.style.backgroundColor = 'hsl(270, 80%, ' + lightness + '%)';
                            hexByte.style.color = lightness > 60 ? '#111' : '#ccc';
                            hexByte.textContent = textContent;
                            hexByte.title = title;
                            if (mode === 'frame') {
                                var rowInFrame = row % 4;
                                if (rowInFrame === 0) hexByte.style.borderTop = '2px solid white';
                                if (rowInFrame === 3) hexByte.style.borderBottom = '2px solid white';
                                if (col === 0) hexByte.style.borderLeft = '2px solid white';
                                if (col === 63) hexByte.style.borderRight = '2px solid white';
                                var frameNum = Math.floor(row / 4);
                                if (frameNum > 0) {
                                    var prevIndex = byteIndex - 256;
                                    if (tokenData[byteIndex] === tokenData[prevIndex]) {
                                        hexByte.style.backgroundColor = '#1a1a1a';
                                        hexByte.textContent = '';
                                        hexByte.title = 'Offset: 0x' + byteIndex.toString(16).toUpperCase() +
                                            '\nValue: ' + byteValue + ' (0x' + textContent + ') - Same as previous frame';
                                    }
                                }
                            }
                        } else {
                            hexByte.style.backgroundColor = '#1a1a1a';
                            hexByte.textContent = '';
                        }
                        rowDiv.appendChild(hexByte);
                    }
                    hexGrid.appendChild(rowDiv);
                }
            }
            window.addEventListener('resize', function () {
                commavqVIZ.ui.x = window.innerWidth;
                commavqVIZ.ui.y = window.innerHeight - header.offsetHeight;
                vizContainer.style.height = `calc(100vh - ${header.offsetHeight}px)`;
            });
        });
    </script>
</body>

</html>
